<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125" role="img" aria-label="Calamardo vs Ollama on a Mac Studio M4 Max: 2.5x faster prefill and 2.8x faster decode at 64K tokens">
  <title>Calamardo vs Ollama benchmark</title>
  <defs>
    <style>
      .sans { font-family: Inter, 'SF Pro Display', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="2000" height="1125" fill="#f4efe6"/>

  <!-- header -->
  <g transform="translate(100 64)">
    <path d="M16 1 C23 8 25 15 24 24 L8 24 C7 15 9 8 16 1Z M9 8 L3 13 L9 15Z M23 8 L29 13 L23 15Z" fill="#141414"/>
    <circle cx="12.5" cy="20.5" r="1.7" fill="#f4efe6"/><circle cx="19.5" cy="20.5" r="1.7" fill="#f4efe6"/>
    <path d="M9 24 C8 30 5 32 6 38 M13 24 C13 31 11 34 12 39 M19 24 C19 31 21 34 20 39 M23 24 C24 30 27 32 26 38" stroke="#141414" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <text x="146" y="98" class="sans" font-size="28" font-weight="800" letter-spacing="7" fill="#141414">CALAMARDO</text>
  <text x="1900" y="96" class="mono" font-size="20" letter-spacing="5" fill="#6b655c" text-anchor="end">BENCHMARK · 23 NOV 2026</text>
  <line x1="100" y1="132" x2="1900" y2="132" stroke="#141414" stroke-width="3"/>

  <!-- title -->
  <text x="96" y="236" class="sans" font-size="80" font-weight="800" letter-spacing="-1" fill="#141414">Calamardo <tspan fill="#e4572e">vs</tspan> Ollama</text>
  <text x="100" y="290" class="sans" font-size="28" fill="#6b655c">Same Inkling 2 Mini checkpoint and drafter · Mac Studio M4 Max, 40-core GPU, 48 GB</text>

  <!-- KPI row -->
  <g stroke="#d6ccbb" stroke-width="2">
    <line x1="100" y1="340" x2="1900" y2="340"/>
    <line x1="550" y1="364" x2="550" y2="536"/>
    <line x1="1000" y1="364" x2="1000" y2="536"/>
    <line x1="1450" y1="364" x2="1450" y2="536"/>
    <line x1="100" y1="560" x2="1900" y2="560"/>
  </g>
  <g class="sans">
    <text x="100" y="466" font-size="112" font-weight="800" letter-spacing="-3" fill="#e4572e">2.5×</text>
    <text x="104" y="506" font-size="25" font-weight="600" fill="#141414">faster prefill at 64K</text>
    <text x="104" y="536" class="mono" font-size="18" fill="#6b655c">714 vs 285 tok/s</text>

    <text x="588" y="466" font-size="112" font-weight="800" letter-spacing="-3" fill="#e4572e">2.8×</text>
    <text x="592" y="506" font-size="25" font-weight="600" fill="#141414">faster decode at 64K</text>
    <text x="592" y="536" class="mono" font-size="18" fill="#6b655c">43.9 vs 15.9 tok/s</text>

    <text x="1038" y="466" font-size="112" font-weight="800" letter-spacing="-3" fill="#141414">1M</text>
    <text x="1042" y="506" font-size="25" font-weight="600" fill="#141414">token context served</text>
    <text x="1042" y="536" class="mono" font-size="18" fill="#6b655c">Ollama crashed at 128K</text>

    <text x="1488" y="466" font-size="112" font-weight="800" letter-spacing="-3" fill="#141414">2 s</text>
    <text x="1492" y="506" font-size="25" font-weight="600" fill="#141414">to restore a 516K-token chat</text>
    <text x="1492" y="536" class="mono" font-size="18" fill="#6b655c">saved to disk in 4 s</text>
  </g>

  <!-- chart headers + legend -->
  <text x="100" y="616" class="mono" font-size="21" letter-spacing="4" fill="#141414">PREFILL <tspan fill="#6b655c" letter-spacing="0">tok/s</tspan></text>
  <text x="1080" y="616" class="mono" font-size="21" letter-spacing="4" fill="#141414">DECODE <tspan fill="#6b655c" letter-spacing="0">tok/s</tspan></text>
  <g class="sans" font-size="19" fill="#141414">
    <rect x="1480" y="600" width="18" height="18" rx="3" fill="#e4572e"/><text x="1506" y="616">Calamardo, 8-bit KV</text>
    <rect x="1712" y="600" width="18" height="18" rx="3" fill="#b9b1a3"/><text x="1738" y="616">Ollama 0.40.17</text>
  </g>

  <!-- prefill chart: baseline 950, 0..900 over 290px -->
  <g stroke="#e2d9ca" stroke-width="1.5">
    <line x1="100" y1="660" x2="920" y2="660"/><line x1="100" y1="756.7" x2="920" y2="756.7"/><line x1="100" y1="853.3" x2="920" y2="853.3"/>
  </g>
  <g class="mono" font-size="15" fill="#9a9385"><text x="100" y="654">900</text><text x="100" y="750">600</text><text x="100" y="847">300</text></g>
  <g fill="#e4572e">
    <rect x="146" y="677.1" width="60" height="272.9" rx="3"/>
    <rect x="346" y="721.2" width="60" height="228.8" rx="3"/>
    <rect x="546" y="764.4" width="60" height="185.6" rx="3"/>
    <rect x="746" y="826.6" width="60" height="123.4" rx="3"/>
  </g>
  <g fill="#b9b1a3">
    <rect x="214" y="755.1" width="60" height="194.9" rx="3"/>
    <rect x="414" y="858.2" width="60" height="91.8" rx="3"/>
  </g>
  <line x1="100" y1="950" x2="920" y2="950" stroke="#141414" stroke-width="2.5"/>
  <g class="mono" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#c2421d"><text x="176" y="668">847</text><text x="376" y="712">710</text><text x="576" y="755">576</text><text x="776" y="817">383</text></g>
    <g fill="#6b655c"><text x="244" y="746">605</text><text x="444" y="849">285</text></g>
    <text x="644" y="938" font-size="30" fill="#d23a2a">✕</text>
    <text x="644" y="902" font-size="15" font-weight="400" fill="#d23a2a">crashed</text>
    <text x="844" y="938" font-size="22" font-weight="400" fill="#9a9385">—</text>
  </g>
  <g class="sans" font-size="21" font-weight="600" fill="#141414" text-anchor="middle">
    <text x="210" y="984">2K</text><text x="410" y="984">64K</text><text x="610" y="984">128K</text><text x="810" y="984">256K</text>
  </g>

  <!-- decode chart: baseline 950, 0..60 over 290px -->
  <g stroke="#e2d9ca" stroke-width="1.5">
    <line x1="1080" y1="660" x2="1900" y2="660"/><line x1="1080" y1="756.7" x2="1900" y2="756.7"/><line x1="1080" y1="853.3" x2="1900" y2="853.3"/>
  </g>
  <g class="mono" font-size="15" fill="#9a9385"><text x="1080" y="654">60</text><text x="1080" y="750">40</text><text x="1080" y="847">20</text></g>
  <g fill="#e4572e">
    <rect x="1126" y="690.5" width="60" height="259.5" rx="3"/>
    <rect x="1326" y="737.8" width="60" height="212.2" rx="3"/>
    <rect x="1526" y="777.0" width="60" height="173.0" rx="3"/>
    <rect x="1726" y="792.0" width="60" height="158.0" rx="3"/>
  </g>
  <g fill="#b9b1a3">
    <rect x="1194" y="771.7" width="60" height="178.3" rx="3"/>
    <rect x="1394" y="873.2" width="60" height="76.8" rx="3"/>
  </g>
  <line x1="1080" y1="950" x2="1900" y2="950" stroke="#141414" stroke-width="2.5"/>
  <g class="mono" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#c2421d"><text x="1156" y="681">53.7</text><text x="1356" y="729">43.9</text><text x="1556" y="768">35.8</text><text x="1756" y="783">32.7</text></g>
    <g fill="#6b655c"><text x="1224" y="762">36.9</text><text x="1424" y="864">15.9</text></g>
    <text x="1624" y="938" font-size="30" fill="#d23a2a">✕</text>
    <text x="1624" y="902" font-size="15" font-weight="400" fill="#d23a2a">crashed</text>
    <text x="1824" y="938" font-size="22" font-weight="400" fill="#9a9385">—</text>
  </g>
  <g class="sans" font-size="21" font-weight="600" fill="#141414" text-anchor="middle">
    <text x="1190" y="984">2K</text><text x="1390" y="984">64K</text><text x="1590" y="984">128K</text><text x="1790" y="984">256K</text>
  </g>

  <!-- footer -->
  <line x1="100" y1="1018" x2="1900" y2="1018" stroke="#141414" stroke-width="3"/>
  <text x="100" y="1060" class="sans" font-size="22" font-weight="700" fill="#141414">github.com/yagop/calamardo</text>
  <text x="1900" y="1060" class="sans" font-size="19" fill="#6b655c" text-anchor="end">scripts/bench.py · unique nonce per prompt · temperature 0 · 256 generated tokens · medians of 2 rounds at 2K and 64K</text>
</svg>
